<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teraz Muza</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎵%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0E1F;
    --paper: #F4F6FC;
    --paper-soft: #E6EAF9;
    --paper-soft-2: #D2D9F3;
    --blue: #0052FF;
    --blue-deep: #0033B8;
    --blue-bright: #2E6BFF;
    --muted: #5A5F78;
    --border: rgba(10,14,31,0.18);
    --border-soft: rgba(10,14,31,0.1);
    --font-display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --font-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
    --danger: #D0263B;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #EEF1FB;
      --paper: #080A16;
      --paper-soft: #10132A;
      --paper-soft-2: #171C3A;
      --blue: #2E6BFF;
      --blue-bright: #6690FF;
      --border: rgba(238,241,251,0.2);
      --border-soft: rgba(238,241,251,0.1);
      --muted: #9AA0C0;
    }
  }
  :root[data-theme="dark"] {
    --ink: #EEF1FB;
    --paper: #080A16;
    --paper-soft: #10132A;
    --paper-soft-2: #171C3A;
    --blue: #2E6BFF;
    --blue-bright: #6690FF;
    --border: rgba(238,241,251,0.2);
    --border-soft: rgba(238,241,251,0.1);
    --muted: #9AA0C0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 0 22px; }

  /* ---------- Nav ---------- */
  header.top {
    position: sticky; top: 0; top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--border);
  }
  .navrow {
    max-width: 920px; margin: 0 auto; padding: 18px 22px;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 18px; flex-wrap: wrap;
  }
  .wordmark { display: inline-flex; align-items: center; }
  .wordmark img { height: 42px; width: auto; display: block; border-radius: 5px; transition: transform 0.15s ease; }
  .wordmark:hover img { transform: scale(1.03); }
  nav.tabs { display: flex; gap: 22px; flex-wrap: wrap; overflow-x: auto; }
  nav.tabs a {
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--muted);
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav.tabs a.active { color: var(--ink); border-bottom-color: var(--blue); }
  nav.tabs a.edytor { color: var(--blue-deep); }
  nav.tabs a.edytor.active { border-bottom-color: var(--blue-bright); }

  main { max-width: 920px; margin: 0 auto; padding: 40px 22px 80px; overflow-x: hidden; }

  .tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 10px;
    border: none;
    color: var(--ink);
    background: var(--paper-soft-2);
    transform: rotate(-2deg);
  }
  .tag.artykul { background: var(--blue); color: #fff; }
  .tag.quiz { background: var(--blue-bright); color: #fff; }
  .tag.zespol { background: var(--ink); color: var(--paper); transform: rotate(2deg); }

  .meta { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

  /* ---------- Home ---------- */
  .hero {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 0;
    margin-bottom: 34px;
    border: 1px solid var(--border);
  }
  .hero-cover { border-left: 1px solid var(--border); background: var(--paper-soft); min-height: 220px; position: relative; overflow: hidden; }
  .hero-cover img { width: 100%; height: 100%; object-fit: cover; }
  .hero-text {
    padding: 30px 30px 32px;
    background: var(--blue);
    background-image: radial-gradient(rgba(255,255,255,0.22) 1.4px, transparent 1.6px);
    background-size: 13px 13px;
  }
  .hero-text .tag { background: var(--ink) !important; color: var(--paper) !important; }
  .hero h1 {
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: uppercase;
    font-style: normal;
    font-size: clamp(2.1rem, 5.5vw, 3.4rem);
    line-height: 0.98;
    letter-spacing: 0.005em;
    margin: 14px 0 12px;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.22);
  }
  .hero p.excerpt { color: rgba(255,255,255,0.88); margin: 0 0 14px; max-width: 56ch; }
  .hero .meta { color: rgba(255,255,255,0.65); }
  .readmore {
    display: inline-block; font-weight: 800; text-decoration: none;
    text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.03em;
    background: var(--ink); color: var(--paper); padding: 8px 18px;
    transform: skewX(-8deg);
  }
  .readmore span { display: inline-block; transform: skewX(8deg); }

  .latest-list { list-style: none; margin: 0; padding: 0; }
  .latest-list li { border-bottom: 1px solid var(--border-soft); }
  .latest-list a {
    display: flex; align-items: baseline; gap: 12px;
    text-decoration: none; padding: 12px 0;
  }
  .latest-list .ll-title { font-weight: 600; flex: 1; }
  .latest-list .ll-date { font-size: 0.76rem; color: var(--muted); white-space: nowrap; }

  h2.section-title {
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: uppercase;
    font-size: 1.2rem;
    letter-spacing: 0.02em;
    margin: 0 0 20px;
  }

  .empty {
    color: var(--muted);
    border: 1px dashed var(--border);
    padding: 26px;
    text-align: center;
    font-size: 0.9rem;
  }

  /* ---------- Articles ---------- */
  .article-card {
    display: grid; grid-template-columns: 140px 1fr; gap: 18px;
    padding: 20px 0; border-bottom: 1px solid var(--border-soft);
    text-decoration: none; color: inherit;
  }
  .article-card .thumb { width: 140px; height: 100px; background: var(--paper-soft); border: 1px solid var(--border); overflow: hidden; }
  .article-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .article-card h3 { font-family: var(--font-display); text-transform: uppercase; font-size: 1.35rem; margin: 0 0 6px; font-weight: 800; }
  .article-card p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  @media (max-width: 560px) {
    .article-card { grid-template-columns: 1fr; }
    .article-card .thumb { width: 100%; height: 150px; }
    .hero { grid-template-columns: 1fr; }
  }

  .article-full h1 {
    font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
    font-size: clamp(2rem, 5.5vw, 3rem); line-height: 1; letter-spacing: 0.005em; margin: 14px 0 6px;
  }
  .article-full .cover { border: 1px solid var(--border); margin: 18px 0; }
  .article-body { font-size: 1.02rem; max-width: 68ch; }
  .article-body img { border: 1px solid var(--border); margin: 14px 0; }
  .article-body b, .article-body strong { font-weight: 700; }

  .back-link { display: inline-block; margin-bottom: 18px; font-size: 0.86rem; color: var(--muted); text-decoration: none; }
  .back-link:before { content: "← "; }

  /* ---------- Quizzes ---------- */
  .quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .quiz-ticket {
    position: relative;
    border: 1px solid var(--border);
    border-left: 4px solid var(--blue);
    background: var(--paper-soft);
    padding: 18px 16px;
    text-decoration: none; color: inherit;
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
  }
  .quiz-ticket h3 { font-family: var(--font-display); text-transform: uppercase; font-size: 1.15rem; margin: 0 0 8px; font-weight: 800; }
  .quiz-ticket .qcount { font-size: 0.78rem; color: var(--blue-deep); font-weight: 600; }
  .quiz-ticket .qtype { font-size: 0.7rem; color: var(--muted); display: block; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.03em; }

  .quiz-q { margin-bottom: 26px; }
  .quiz-q p.qtext { font-weight: 600; margin: 0 0 10px; }
  .quiz-opt { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
  .quiz-opt input { accent-color: var(--blue-bright); }
  .quiz-result { border: 1px solid var(--blue-bright); padding: 20px; margin-top: 10px; }
  .quiz-result .score { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
  .quiz-result .outcome-label { font-family: var(--font-display); text-transform: uppercase; font-size: 1.6rem; font-weight: 800; color: var(--blue-deep); }
  .quiz-result .outcome-desc { margin-top: 8px; color: var(--muted); }

  .type-switch { display: flex; gap: 0; margin-bottom: 18px; border: 1px solid var(--border); width: fit-content; }
  .type-switch button { background: none; border: none; padding: 8px 16px; cursor: pointer; color: var(--muted); font-size: 0.85rem; }
  .type-switch button.active { background: var(--ink); color: var(--paper); }
  .outcome-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .outcome-row input[type=text] { flex: 1; }
  .outcome-swatch { width: 14px; height: 14px; border-radius: 50%; background: var(--blue-bright); flex-shrink: 0; }

  /* ---------- Bands ---------- */
  .band { border-bottom: 1px solid var(--border-soft); padding: 20px 0; }
  .band-head { display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .band-photo { width: 56px; height: 56px; border: 1px solid var(--border); background: var(--paper-soft); flex-shrink: 0; overflow: hidden; }
  .band-photo img { width: 100%; height: 100%; object-fit: cover; }
  .band-head-text { flex: 1; }
  .band-head h3 { font-family: var(--font-display); text-transform: uppercase; font-size: 1.4rem; margin: 0; font-weight: 800; }
  .band-head .chevron { color: var(--muted); font-size: 0.8rem; transition: transform 0.15s ease; margin-left: auto; flex-shrink: 0; }
  .band.open > .band-head .chevron { transform: rotate(90deg); }
  .band-summary { color: var(--muted); margin: 6px 0 0; max-width: 65ch; }
  .band-sections { display: none; margin-top: 16px; border-top: 1px solid var(--border-soft); }
  .band.open .band-sections { display: block; }
  .band-section { padding: 14px 0; border-bottom: 1px solid var(--border-soft); }
  .band-section h4 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; font-size: 1rem; margin: 0 0 6px; font-weight: 700; }
  .band-section p { margin: 0; color: var(--muted); font-size: 0.92rem; white-space: pre-wrap; }

  /* ---------- Forms / Editor ---------- */
  .editor-tabs { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
  .editor-tabs button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 8px 14px; cursor: pointer;
  }
  .editor-tabs button.active { color: var(--blue-deep); border-color: var(--blue-bright); }
  fieldset { border: 1px solid var(--border); padding: 18px; margin: 0 0 18px; }
  legend { padding: 0 8px; font-size: 0.8rem; color: var(--muted); }
  label.field { display: block; margin-bottom: 16px; }
  label.field span { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
  input[type=text], textarea {
    width: 100%; background: var(--paper); color: var(--ink);
    border: 1px solid var(--border); padding: 10px 12px;
  }
  textarea { resize: vertical; min-height: 80px; }
  .rte-toolbar { display: flex; gap: 6px; margin-bottom: 6px; }
  .rte-toolbar button {
    border: 1px solid var(--border); background: var(--paper); color: var(--ink);
    width: 32px; height: 32px; cursor: pointer;
  }
  .rte-toolbar button.i-btn { font-style: italic; }
  .rte-toolbar button.b-btn { font-weight: 700; }
  .rte-body {
    border: 1px solid var(--border); background: var(--paper);
    min-height: 160px; padding: 12px; overflow-y: auto;
  }
  .rte-body:focus { outline: 2px solid var(--blue-bright); outline-offset: -2px; }
  .btn {
    display: inline-block; border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    padding: 10px 20px; cursor: pointer; font-weight: 700; font-size: 0.85rem;
    text-transform: uppercase; letter-spacing: 0.02em;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 100%, 10px 100%);
  }
  .btn:hover { background: var(--blue); border-color: var(--blue); }
  .btn.secondary { background: none; color: var(--ink); }
  .btn.secondary:hover { background: var(--paper-soft-2); color: var(--ink); }
  .btn.danger { background: none; color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: #fff; }
  .btn.small { padding: 6px 12px; font-size: 0.8rem; }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .qopt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .qopt-row input[type=text] { flex: 1; }
  .qblock, .sblock { border: 1px solid var(--border-soft); padding: 14px; margin-bottom: 12px; }
  .status-msg { font-size: 0.85rem; margin: 10px 0; }
  .status-msg.ok { color: var(--blue-deep); }
  .status-msg.err { color: var(--danger); }
  .manage-list { list-style: none; padding: 0; margin: 30px 0 0; }
  .manage-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-soft); font-size: 0.9rem; }
  .locked-note { border: 1px dashed var(--border); padding: 26px; color: var(--muted); text-align: center; }
  .login-box { max-width: 320px; margin: 0 auto; padding: 30px 0; text-align: center; }
  .login-box h2 { font-family: var(--font-display); text-transform: uppercase; font-weight: 800; margin: 0 0 16px; }
  .login-box input { text-align: center; margin-bottom: 12px; }
  .login-err { color: var(--danger); font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }

  /* ---------- Link buttons, edit, artist ---------- */
  .band { scroll-margin-top: 90px; }
  .band-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .link-btn {
    display: inline-block; text-decoration: none; cursor: pointer;
    font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.02em;
    padding: 9px 18px; border: none;
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 100%, 9px 100%);
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  a.link-btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .band-articles { display: flex; flex-direction: column; gap: 6px; }
  .band-articles a { font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--border); width: fit-content; }
  .band-articles a:hover { color: var(--blue); border-color: var(--blue); }
  .article-artist { margin: 8px 0 0; font-size: 0.9rem; color: var(--muted); }
  .article-artist a { font-weight: 700; color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--blue); }
  .color-row { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 12px; font-size: 0.82rem; color: var(--muted); }
  .color-row label { display: flex; align-items: center; gap: 8px; }
  input[type=color] { width: 44px; height: 32px; padding: 0; border: 1px solid var(--border); background: none; cursor: pointer; }
  .lb-preview-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .check { display: flex; gap: 8px; align-items: center; margin: -6px 0 16px; font-size: 0.85rem; color: var(--muted); }
  select { background: var(--paper); color: var(--ink); border: 1px solid var(--border); padding: 9px 10px; }
  .field select { width: 100%; }
  .manage-list .row { gap: 6px; flex-wrap: nowrap; }

  .login-hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 14px; }
  .login-ok { color: var(--blue-deep); font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
  .foot { max-width: 920px; margin: 0 auto; padding: 0 22px 40px; font-size: 0.75rem; }
  .foot a { color: var(--muted); text-decoration: none; }
  .foot a:hover { color: var(--ink); }

  .embeds { display: flex; flex-direction: column; gap: 16px; margin: 22px 0; }
  .embeds iframe { width: 100%; border: 0; border-radius: 12px; }
  .embed-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 0.88rem; word-break: break-all; }
  .em-msg { margin-left: 10px; }
  div.field { margin-bottom: 16px; }
  div.field > span, .rp-field > span { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
  .rp-field { margin-bottom: 10px; }
  .rte-toolbar button.t-wide { width: auto; padding: 0 10px; font-size: 0.78rem; font-weight: 600; }
  .rte-panel { border: 1px solid var(--border); background: var(--paper-soft); padding: 12px; margin-bottom: 8px; }
  .rte-body .link-btn { margin: 2px 4px; }
  .article-body .link-btn { margin: 4px 6px 4px 0; }
  .article-body a:not(.link-btn) { font-weight: 600; text-decoration: none; border-bottom: 2px solid var(--blue); }
  .page-title { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: clamp(2rem, 5.5vw, 3rem); line-height: 1; margin: 0 0 18px; }
  .sec-ctl { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .sub-title { font-family: var(--font-display); text-transform: uppercase; font-size: 1rem; margin: 14px 0 8px; }
  .bs { padding: 0; }
  .bs-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; padding: 14px 0; }
  .bs-head h4 { margin: 0; }
  .bs-head .chevron { color: var(--muted); font-size: 0.7rem; transition: transform 0.15s ease; }
  .bs-body { display: none; padding: 0 0 14px; }
  .bs.bs-open .bs-body { display: block; }
  .bs.bs-open .bs-head .chevron { transform: rotate(90deg); }
  .bs-body .band-links { margin-top: 12px; }

  input[type=search] { width: 100%; background: var(--paper); color: var(--ink); border: 1px solid var(--border); padding: 11px 14px; font-size: 1rem; }
  input[type=search]:focus { outline: 2px solid var(--blue); outline-offset: -2px; }
  .search-box { margin-bottom: 22px; }
  .mini-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 0 28px; }
  .mini { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); text-decoration: none; color: inherit; }
  .mini-thumb { width: 72px; height: 72px; flex-shrink: 0; background: var(--paper-soft); border: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .mini-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .mini-thumb.no-img { background: var(--blue); border-color: var(--blue); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; }
  .mini-text { min-width: 0; flex: 1; }
  .mini-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .mini h3 { font-family: var(--font-display); text-transform: uppercase; font-size: 1.05rem; font-weight: 800; margin: 0 0 2px; line-height: 1.1; }
  .mini p { margin: 0; color: var(--muted); font-size: 0.82rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mini:hover h3 { color: var(--blue-deep); }
  .mini .ll-date { font-size: 0.74rem; color: var(--muted); white-space: nowrap; }

  a.btn { text-decoration: none; }
  .privacy-note { font-size: 0.78rem; color: var(--muted); margin-top: 16px; max-width: 60ch; }
  .mod-card { border: 1px solid var(--border); padding: 14px; margin-bottom: 12px; }
  .mod-card details { margin: 10px 0; font-size: 0.9rem; }
  .mod-card summary { cursor: pointer; font-weight: 600; }
  .mod-card ul { margin: 4px 0 10px; padding-left: 20px; }
  .mod-card li.ok { font-weight: 700; }

  .band-genre { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--blue); margin: 2px 0 4px; }

  .share-row { margin: 10px 0 14px; }
  .quiz-result .share-row { margin: 14px 0 0; }

  .byline { display: flex; align-items: center; gap: 10px; margin: 8px 0 2px; font-weight: 700; }
  .byline img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
  .j-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--border); padding: 12px 14px; margin-bottom: 16px; }
  .j-card .byline { margin: 0; }
  .mod-img { max-width: 100%; margin: 8px 0; }
  .manage-list .byline { margin: 0 0 2px; }
  .j-edit-row { display: block; }

  .ad-slot { margin: 0 auto; max-width: 920px; padding: 10px 22px 0; }
  .ad-slot .ad-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
  .ad-slot a { display: block; }
  .ad-slot img { display: block; max-width: 100%; max-height: 130px; margin: 0 auto; object-fit: contain; border: 1px solid var(--border); background: #fff; transition: opacity 0.3s ease; }
  .ad-slot img.ad-fade { opacity: 0; }
  @media (max-width: 1239px) { .ad-slot.no-narrow { display: none; } }
  @media (min-width: 1240px) {
    .ad-slot { position: fixed; left: 18px; top: 120px; width: min(220px, calc((100vw - 920px) / 2 - 40px)); max-width: none; margin: 0; padding: 0; z-index: 5; }
    .ad-slot img { width: 100%; max-height: none; height: auto; }
  }
  .ad-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ad-row img { width: 56px; height: 56px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }

  /* ---------- Texture & flourish ---------- */
  .groove-mark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .groove-mark .eq-bar { width: 12%; background: var(--blue); animation: eq-pulse 1.1s ease-in-out infinite; }
  .groove-mark .eq-bar:nth-child(1) { height: 30%; animation-delay: -0.9s; }
  .groove-mark .eq-bar:nth-child(2) { height: 60%; animation-delay: -0.6s; }
  .groove-mark .eq-bar:nth-child(3) { height: 90%; animation-delay: -0.3s; }
  .groove-mark .eq-bar:nth-child(4) { height: 55%; animation-delay: -1.05s; }
  .groove-mark .eq-bar:nth-child(5) { height: 40%; animation-delay: -0.15s; }
  @keyframes eq-pulse { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .groove-mark .eq-bar { animation: none; } }

  h2.section-title { position: relative; display: flex; align-items: center; gap: 14px; }
  h2.section-title:after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .latest-list a, .article-card, .quiz-ticket, nav.tabs a, .band-head .chevron, .readmore, .btn {
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  .article-card:hover h3, .latest-list a:hover .ll-title { color: var(--blue-deep); }
  .quiz-ticket:hover { border-color: var(--blue-bright); transform: translateY(-2px); }
  nav.tabs a:hover { color: var(--ink); }
  .readmore:hover { transform: skewX(-8deg) scale(1.03); background: var(--blue); }
  .article-card:hover { transform: translateX(2px); }
</style>
</head>

(function(){
  "use strict";

  var state = { articles: [], quizzes: [], bands: [], pages: [], uquizzes: [], jarticles: [], jbands: [], journalists: [] };
  var loaded = false, loadError = false;
  var authReady = false, currentUser = null, loginNote = '';
  var myQuizzes = [], pendingQuizzes = [], myQuizEdit;

  var appEl = document.getElementById('app');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtDate(ts){
    var d = new Date(ts);
    return d.toLocaleDateString('pl-PL', { day:'2-digit', month:'short', year:'numeric' });
  }

  function allItems(){
    var items = [];
    allArticles().forEach(function(a){ items.push({type:'artykul', typeLabel:'Artykuł', id:a.id, title:a.title, excerpt:a.excerpt, cover:safeImg(a.cover) || null, createdAt:a.createdAt}); });
    allQuizzes().forEach(function(q){ items.push({type:'quiz', typeLabel:'Quiz', id:q.id, title:q.title, excerpt:(q.questions.length)+' pytań', cover:null, createdAt:q.createdAt}); });
    allBands().forEach(function(b){ items.push({type:'zespol', typeLabel:'Zespół', id:b.id, title:b.name, excerpt:(b.genre ? b.genre + ' · ' : '') + (b.summary || ''), cover:safeImg(b.cover)||null, createdAt:b.createdAt}); });
    items.sort(function(x,y){ return y.createdAt - x.createdAt; });
    return items;
  }

  function vinylSvg(){
    return '<div class="groove-mark">'+
      '<div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>'+
    '</div>';
  }

  function itemHref(item){
    if(item.type === 'artykul') return '#/artykul/' + item.id;
    if(item.type === 'quiz') return '#/quiz/' + item.id;
    return '#/zespol/' + item.id;
  }

  /* ---------------- ROUTES ---------------- */

  function renderNav(route){
    var tabs = [
      {href:'#/', label:'Strona główna', match:'home'},
      {href:'#/artykuly', label:'Artykuły', match:'artykuly'},
      {href:'#/quizy', label:'Quizy', match:'quizy'},
      {href:'#/zespoly', label:'Zespoły', match:'zespoly'},
      {href:'#/kontakt', label:'Kontakt', match:'kontakt'}
    ];
    var html = tabs.map(function(t){
      var cls = (route === t.match) ? 'active' : '';
      return '<a class="'+cls+'" href="'+t.href+'">'+t.label+'</a>';
    }).join('');
    if(canEdit){
      var ecls = (route === 'edytor') ? 'edytor active' : 'edytor';
      html += '<a class="'+ecls+'" href="#/edytor">Edytor</a>';
    }
    tabsEl.innerHTML = html;
  }

  function renderHome(){
    var items = allItems();
    if(items.length === 0){
      appEl.innerHTML = '<div class="empty">Jeszcze nic tu nie ma. Zajrzyj wkrótce.</div>';
      return;
    }
    var hero = items[0];
    var rest = items.slice(1);
    var heroImg = hero.cover ? '<img src="'+hero.cover+'" alt="">' : vinylSvg();
    var html = '';
    html += '<div class="hero">';
    html += '  <div class="hero-text">';
    html += '    <span class="tag '+hero.type+'">'+hero.typeLabel+'</span>';
    html += '    <h1>'+esc(hero.title)+'</h1>';
    html += '    <p class="excerpt">'+esc(hero.excerpt||'')+'</p>';
    html += '    <div class="meta">'+fmtDate(hero.createdAt)+'</div>';
    html += '    <p style="margin-top:14px"><a class="readmore" href="'+itemHref(hero)+'"><span>Zobacz</span></a></p>';
    html += '  </div>';
    html += '  <div class="hero-cover">'+heroImg+'</div>';
    html += '</div>';
    if(rest.length){
      html += '<h2 class="section-title">Wcześniej</h2><div id="mini-holder"></div>';
    }
    appEl.innerHTML = html;
    if(rest.length) drawMini(rest, 12);
  }

  function drawMini(rest, count){
    var holder = document.getElementById('mini-holder');
    if(!holder) return;
    var html = '<div class="mini-list">' + rest.slice(0, count).map(function(it){
      var thumb = it.cover ? '<img src="'+it.cover+'" alt="">' : '<span>'+esc((it.title || '?').charAt(0))+'</span>';
      return '<a class="mini" href="'+itemHref(it)+'">'+
        '<div class="mini-thumb'+(it.cover ? '' : ' no-img')+'">'+thumb+'</div>'+
        '<div class="mini-text">'+
          '<div class="mini-top"><span class="tag '+it.type+'">'+it.typeLabel+'</span><span class="ll-date">'+fmtDate(it.createdAt)+'</span></div>'+
          '<h3>'+esc(it.title)+'</h3>'+
          (it.excerpt ? '<p>'+esc(it.excerpt)+'</p>' : '')+
        '</div></a>';
    }).join('') + '</div>';
    if(rest.length > count){
      html += '<div class="row" style="margin-top:18px;justify-content:center"><button type="button" class="btn secondary" id="mini-more">Pokaż więcej ('+(rest.length - count)+')</button></div>';
    }
    holder.innerHTML = html;
    var more = document.getElementById('mini-more');
    if(more) more.addEventListener('click', function(){ drawMini(rest, count + 12); });
  }

  function renderArticles(){
    if(allArticles().length === 0){ appEl.innerHTML = '<div class="empty">Brak artykułów.</div>'; return; }
    var sorted = allArticles().slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
    var html = sorted.map(function(a){
      var thumb = safeImg(a.cover) ? '<img src="'+safeImg(a.cover)+'" alt="">' : '';
      var bnd = a.bandId ? findBand(a.bandId) : null;
      var au = authorOf(a);
      return '<a class="article-card" href="#/artykul/'+a.id+'">'+
        '<div class="thumb">'+thumb+'</div>'+
        '<div><h3>'+esc(a.title)+'</h3><p>'+esc(a.excerpt||'')+'</p><div class="meta">'+fmtDate(a.createdAt)+(au ? ' · '+esc(au.name) : '')+(bnd ? ' · '+esc(bnd.name) : '')+'</div></div>'+
      '</a>';
    }).join('');
    appEl.innerHTML = html;
  }

  function renderArticleFull(id){
    var a = allArticles().filter(function(x){ return x.id === id; })[0];
    if(!a){ appEl.innerHTML = '<div class="empty">Nie znaleziono artykułu.</div>'; return; }
    var cover = safeImg(a.cover) ? '<div class="cover"><img src="'+safeImg(a.cover)+'" alt=""></div>' : '';
    var bnd = a.bandId ? findBand(a.bandId) : null;
    var shareRow = shareRowHtml('#/artykul/' + a.id, a.title, a.excerpt || a.title);
    var artistLine = bnd ? '<div class="article-artist">Artysta: <a href="#/zespol/'+bnd.id+'">'+esc(bnd.name)+'</a></div>' : '';
    appEl.innerHTML =
      '<a class="back-link" href="#/artykuly">Artykuły</a>'+
      '<div class="article-full">'+
      '<span class="tag artykul">Artykuł</span>'+
      '<h1>'+esc(a.title)+'</h1>'+
      bylineHtml(a)+
      '<div class="meta">'+fmtDate(a.createdAt)+'</div>'+
      artistLine+
      shareRow+
      cover+
      '<div class="article-body">'+sanitizeHtml(a.contentHtml)+'</div>'+
      renderEmbeds(a.embeds)+
      '</div>';
  }

  function quizTypeLabel(q){ return (q.type === 'wynik') ? 'Quiz z wynikiem' : 'Quiz wiedzy'; }

  function fold(s){
    return (s || '').toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function renderQuizzes(){
    var addBtn = '<div class="row" style="margin-bottom:14px"><a class="btn small" href="#/moje-quizy">+ Dodaj własny quiz</a></div>';
    if(allQuizzes().length === 0){ appEl.innerHTML = addBtn + '<div class="empty">Brak quizów.</div>'; return; }
    var sorted = allQuizzes().slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
    appEl.innerHTML = addBtn + '<div class="search-box"><input type="search" id="quiz-search" placeholder="Szukaj quizu…" autocomplete="off"></div><div id="quiz-results"></div>';
    var input = document.getElementById('quiz-search');
    var holder = document.getElementById('quiz-results');
    function draw(query){
      var needle = fold(query).trim();
      var list = sorted.filter(function(q){
        if(!needle) return true;
        var hay = q.title + ' ' + quizTypeLabel(q) + ' ' + (q.outcomes || []).map(function(o){ return o.label; }).join(' ');
        return fold(hay).indexOf(needle) > -1;
      });
      if(!list.length){ holder.innerHTML = '<div class="empty">Nie znaleziono quizów pasujących do „'+esc(query.trim())+'”.</div>'; return; }
      holder.innerHTML = '<div class="quiz-grid">' + list.map(function(q){
        return '<a class="quiz-ticket" href="#/quiz/'+q.id+'"><h3>'+esc(q.title)+'</h3><div class="qcount">'+q.questions.length+' pytań</div><span class="qtype">'+quizTypeLabel(q)+(q.ownerName ? ' · '+esc(q.ownerName) : '')+'</span></a>';
      }).join('') + '</div>';
    }
    input.addEventListener('input', function(){ draw(input.value); });
    draw('');
  }

  function renderQuizTake(id){
    var q = allQuizzes().filter(function(x){ return x.id === id; })[0];
    if(!q){ appEl.innerHTML = '<div class="empty">Nie znaleziono quizu.</div>'; return; }
    var isResultType = (q.type === 'wynik');
    var html = '<a class="back-link" href="#/quizy">Quizy</a>';
    html += '<span class="tag quiz">'+quizTypeLabel(q)+'</span><h1 style="font-family:var(--font-display);margin:12px 0 22px;">'+esc(q.title)+'</h1>';
    if(q.ownerName) html += '<div class="meta" style="margin:-12px 0 18px">Autor: '+esc(q.ownerName)+'</div>';
    html += shareRowHtml('#/quiz/' + q.id, q.title, 'Quiz: ' + q.title);
    html += '<form id="quiz-form">';
    q.questions.forEach(function(qq, qi){
      html += '<div class="quiz-q"><p class="qtext">'+(qi+1)+'. '+esc(qq.text)+'</p>';
      qq.options.forEach(function(opt, oi){
        var label = isResultType ? opt.text : opt;
        html += '<label class="quiz-opt"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+esc(label)+'</label>';
      });
      html += '</div>';
    });
    html += '<button type="submit" class="btn">Sprawdź wynik</button>';
    html += '</form><div id="quiz-result"></div>';
    appEl.innerHTML = html;

    document.getElementById('quiz-form').addEventListener('submit', function(ev){
      ev.preventDefault();
      if(!isResultType){
        var score = 0;
        q.questions.forEach(function(qq, qi){
          var picked = ev.target.querySelector('input[name="q'+qi+'"]:checked');
          if(picked && parseInt(picked.value,10) === qq.correct) score++;
        });
        document.getElementById('quiz-result').innerHTML =
          '<div class="quiz-result"><div class="score">'+score+' / '+q.questions.length+'</div><p>Wynik quizu.</p>'+shareRowHtml('#/quiz/' + q.id, q.title, 'Mój wynik w quizie „' + q.title + '”: ' + score + ' / ' + q.questions.length, 'Udostępnij swój wynik')+'</div>';
        return;
      }
      var tally = {};
      q.outcomes.forEach(function(o){ tally[o.id] = 0; });
      var answered = 0;
      q.questions.forEach(function(qq, qi){
        var picked = ev.target.querySelector('input[name="q'+qi+'"]:checked');
        if(picked){
          answered++;
          var oi = parseInt(picked.value,10);
          var outcomeId = qq.options[oi].outcomeId;
          if(tally[outcomeId] === undefined) tally[outcomeId] = 0;
          tally[outcomeId]++;
        }
      });
      if(answered < q.questions.length){
        document.getElementById('quiz-result').innerHTML = '<p class="status-msg err">Odpowiedz na wszystkie pytania.</p>';
        return;
      }
      var winnerId = null, winnerCount = -1;
      q.outcomes.forEach(function(o){
        if(tally[o.id] > winnerCount){ winnerCount = tally[o.id]; winnerId = o.id; }
      });
      var winner = q.outcomes.filter(function(o){ return o.id === winnerId; })[0];
      document.getElementById('quiz-result').innerHTML =
        '<div class="quiz-result"><div class="outcome-label">'+esc(winner.label)+'</div><p class="outcome-desc">'+esc(winner.description||'')+'</p>'+shareRowHtml('#/quiz/' + q.id, q.title, 'Mój wynik w quizie „' + q.title + '”: ' + winner.label, 'Udostępnij swój wynik')+'</div>';
    });
  }

  function sectionHtml(heading, inner){
    return '<div class="band-section bs"><div class="bs-head"><h4>'+esc(heading || 'Sekcja')+'</h4><span class="chevron">▶</span></div><div class="bs-body">'+inner+'</div></div>';
  }

  function renderBands(openId){
    if(allBands().length === 0){ appEl.innerHTML = '<div class="empty">Brak zespołów.</div>'; return; }
    var sorted = allBands().slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
    appEl.innerHTML = '<div class="search-box"><input type="search" id="band-search" placeholder="Szukaj zespołu…" autocomplete="off"></div><div id="bands-list"></div>';
    var input = document.getElementById('band-search');
    var holder = document.getElementById('bands-list');

    function bandHtml(b){
      var secs = (b.sections || []).map(function(s){
        var links = (s.buttons || []).map(linkBtnHtml).join('');
        return sectionHtml(s.heading, (s.content ? '<p>'+esc(s.content)+'</p>' : '') + (links ? '<div class="band-links">'+links+'</div>' : ''));
      }).join('');
      var arts = allArticles().filter(function(a){ return a.bandId === b.id; });
      if(arts.length){
        secs += sectionHtml('Artykuły o tym artyście', '<div class="band-articles">'+arts.map(function(a){
          return '<a href="#/artykul/'+a.id+'">'+esc(a.title)+'</a>';
        }).join('')+'</div>');
      }
      var links = (b.buttons || []).map(linkBtnHtml).join('');
      var linksHtml = '<div class="band-links">'+links+shareBtnHtml('#/zespol/' + b.id, b.name, (b.genre ? b.genre + ' · ' : '') + (b.summary || b.name))+'</div>';
      var photo = safeImg(b.cover) ? '<div class="band-photo"><img src="'+safeImg(b.cover)+'" alt=""></div>' : '';
      return '<div class="band'+(b.id === openId ? ' open' : '')+'" data-id="'+b.id+'">'+
        '<div class="band-head">'+photo+'<div class="band-head-text"><h3>'+esc(b.name)+'</h3>'+(b.genre ? '<div class="band-genre">'+esc(b.genre)+'</div>' : '')+'<p class="band-summary">'+esc(b.summary || '')+'</p></div><span class="chevron">▶</span></div>'+
        linksHtml+
        '<div class="band-sections">'+renderEmbeds(b.embeds)+secs+'</div>'+
      '</div>';
    }

    function draw(query){
      var needle = fold(query).trim();
      var list = sorted.filter(function(b){
        if(!needle) return true;
        var hay = b.name + ' ' + (b.genre || '') + ' ' + (b.summary || '') + ' ' + (b.sections || []).map(function(s){ return (s.heading || '') + ' ' + (s.content || ''); }).join(' ');
        return fold(hay).indexOf(needle) > -1;
      });
      if(!list.length){ holder.innerHTML = '<div class="empty">Nie znaleziono zespołów pasujących do „'+esc(query.trim())+'”.</div>'; return; }
      holder.innerHTML = list.map(bandHtml).join('');
      holder.querySelectorAll('.band-head').forEach(function(h){
        h.addEventListener('click', function(){ h.parentElement.classList.toggle('open'); });
      });
      holder.querySelectorAll('.bs-head').forEach(function(h){
        h.addEventListener('click', function(){ h.parentElement.classList.toggle('bs-open'); });
      });
    }

    input.addEventListener('input', function(){ draw(input.value); });
    draw('');
    if(openId){
      var el = holder.querySelector('.band[data-id="'+openId+'"]');
      if(el && el.scrollIntoView) el.scrollIntoView();
    }
  }

  function renderContact(){
    var p = findItem('pages', 'kontakt');
    var title = (p && p.title) ? p.title : 'Kontakt';
    var links = p ? (p.buttons || []).map(linkBtnHtml).join('') : '';
    var hasBody = p && p.contentHtml && p.contentHtml.replace(/<[^>]*>/g, '').trim() !== '' || (p && /<img|<a /i.test(p.contentHtml || ''));
    var html = '<h1 class="page-title">'+esc(title)+'</h1>';
    if(!hasBody && !links){
      html += '<div class="empty">Dane kontaktowe pojawią się wkrótce.</div>';
    } else {
      html += '<div class="article-body">'+sanitizeHtml(p.contentHtml || '')+'</div>';
      if(links) html += '<div class="band-links" style="margin-top:18px">'+links+'</div>';
    }
    appEl.innerHTML = html;
  }

  /* ---------------- EDITOR ---------------- */

  var editorTab = 'artykul';
  var editing = null;
  function findItem(key, id){ return (state[key] || []).filter(function(x){ return x.id === id; })[0] || null; }
  function normUrl(u){
    u = (u || '').trim();
    if(!u) return null;
    if(/^https?:[/][/]/i.test(u)) return u;
    if(/^(mailto|tel):[^\s]+$/i.test(u)) return u;
    if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return null;
    if(/^[^\s@]+@[^\s@]+[.][^\s@]+$/.test(u)) return 'mailto:' + u;
    return 'https://' + u;
  }
  function hexOr(c, d){ return /^#[0-9a-f]{6}$/i.test(c || '') ? c : d; }

  function parseEmbed(input){
    var s = (input || '').trim();
    if(!s) return null;
    var height = null;
    if(/<iframe/i.test(s)){
      var sm = s.match(/src\s*=\s*["']([^"']+)["']/i);
      if(!sm) return null;
      var hm = s.match(/height\s*=\s*["']?(\d+)/i);
      if(hm) height = parseInt(hm[1], 10);
      s = sm[1];
    }
    s = s.replace(/&amp;/g, '&');
    if(s.indexOf('//') === 0) s = 'https:' + s;
    var u;
    try { u = new URL(s); } catch(e){ return null; }
    if(u.protocol !== 'https:') return null;
    var host = u.hostname.toLowerCase(), path = u.pathname;
    var src = null, video = false, def = 300, m;
    if(host === 'open.spotify.com'){
      def = 352;
      m = path.match(/^[/](?:intl-[a-z]+[/])?(album|track|playlist|artist|episode|show)[/]([A-Za-z0-9]+)/);
      if(path.indexOf('/embed') === 0) src = u.href;
      else if(m) src = 'https://open.spotify.com/embed/' + m[1] + '/' + m[2];
    } else if(host === 'www.youtube.com' || host === 'youtube.com' || host === 'www.youtube-nocookie.com'){
      video = true;
      if(path.indexOf('/embed/') === 0) src = u.href;
      else if(path === '/watch' && u.searchParams.get('v')) src = 'https://www.youtube.com/embed/' + u.searchParams.get('v').replace(/[^A-Za-z0-9_-]/g, '');
    } else if(host === 'youtu.be'){
      video = true;
      var yid = path.slice(1).replace(/[^A-Za-z0-9_-]/g, '');
      if(yid) src = 'https://www.youtube.com/embed/' + yid;
    } else if(host === 'player.vimeo.com'){
      video = true;
      if(path.indexOf('/video/') === 0) src = u.href;
    } else if(host === 'vimeo.com'){
      video = true;
      m = path.match(/^[/](\d+)/);
      if(m) src = 'https://player.vimeo.com/video/' + m[1];
    } else if(host === 'bandcamp.com' || /[.]bandcamp[.]com$/.test(host)){
      def = 120;
      if(path.indexOf('/EmbeddedPlayer') === 0) src = u.href;
    } else if(host === 'w.soundcloud.com'){
      def = 166;
      if(path.indexOf('/player') === 0) src = u.href;
    } else if(host === 'embed.music.apple.com'){
      def = 450;
      src = u.href;
    } else if(host === 'widget.deezer.com'){
      if(path.indexOf('/widget/') === 0) src = u.href;
    }
    if(!src) return null;
    var h = height || def;
    if(h < 80) h = 80;
    if(h > 800) h = 800;
    return { src: src, height: h, video: video };
  }

  function renderEmbeds(list){
    if(!list || !list.length) return '';
    var out = list.map(function(e){
      var p = parseEmbed(e && e.src);
      if(!p) return '';
      var h = parseInt(e.height, 10);
      if(!(h >= 80 && h <= 800)) h = p.height;
      var size = p.video ? 'style="aspect-ratio:16/9;height:auto"' : 'height="' + h + '"';
      return '<iframe src="' + esc(p.src) + '" width="100%" ' + size + ' frameborder="0" loading="lazy" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>';
    }).join('');
    return out ? '<div class="embeds">' + out + '</div>' : '';
  }

  function embedLabel(e){
    try {
      var u = new URL(e.src);
      return u.hostname.replace(/^www[.]/, '') + u.pathname.replace(/[/]embed/, '');
    } catch(err){ return 'osadzenie'; }
  }

  function mountEmbedEditor(box, list){
    function draw(){
      box.innerHTML =
        '<h2 class="section-title" style="margin-top:22px">Osadzenia (Spotify, YouTube…)</h2>'+
        list.map(function(e, i){
          return '<div class="embed-item"><span>'+esc(embedLabel(e))+'</span><button type="button" class="btn small danger em-remove" data-i="'+i+'">Usuń</button></div>';

  function mountRte(box, initialHtml){
    box.innerHTML =
      '<div class="field"><span>Treść</span>'+
      '<div class="rte-toolbar">'+
        '<button type="button" class="b-btn" data-cmd="bold" title="Pogrubienie">B</button>'+
        '<button type="button" class="i-btn" data-cmd="italic" title="Kursywa">I</button>'+
        '<button type="button" data-cmd="link" title="Link w tekście">🔗</button>'+
        '<button type="button" data-cmd="image" title="Wstaw zdjęcie">🖼</button>'+
        '<button type="button" class="t-wide" data-cmd="button" title="Wstaw przycisk z linkiem">Przycisk</button>'+
        '<input type="file" class="rte-file" accept="image/*" style="display:none">'+
      '</div>'+
      '<div class="rte-panel" style="display:none">'+
        '<div class="rp-field"><span>Napis na przycisku</span><input type="text" class="rp-label"></div>'+
        '<div class="rp-field"><span>Link</span><input type="text" class="rp-url" placeholder="https://… albo adres e-mail"></div>'+
        '<div class="color-row"><label>Kolor przycisku <input type="color" class="rp-bg" value="#0052ff"></label><label>Kolor tekstu <input type="color" class="rp-fg" value="#ffffff"></label></div>'+
        '<div class="row"><button type="button" class="btn small rp-insert">Wstaw przycisk</button><button type="button" class="btn small secondary rp-cancel">Anuluj</button><span class="status-msg err rp-msg"></span></div>'+
      '</div>'+
      '<div class="rte-body" contenteditable="true"></div>'+
      '</div>';
    var body = box.querySelector('.rte-body');
    body.innerHTML = initialHtml || '';
    var panel = box.querySelector('.rte-panel');
    var fileInput = box.querySelector('.rte-file');
    var saved = null;

    function remember(){
      var sel = window.getSelection();
      if(sel && sel.rangeCount){
        var r = sel.getRangeAt(0);
        if(body.contains(r.commonAncestorContainer)) saved = r.cloneRange();
      }
    }
    document.addEventListener('selectionchange', remember);
    function restore(){
      body.focus();
      var sel = window.getSelection();
      sel.removeAllRanges();
      if(saved){ sel.addRange(saved); }
      else { var r = document.createRange(); r.selectNodeContents(body); r.collapse(false); sel.addRange(r); }
    }
    function hasSelectionInBody(){
      var sel = window.getSelection();
      return !!(sel && sel.rangeCount && body.contains(sel.getRangeAt(0).commonAncestorContainer));
    }
    function fixLinks(){
      body.querySelectorAll('a[href]').forEach(function(a){
        if(a.classList.contains('link-btn')) return;
        if(/^https?:/i.test(a.getAttribute('href') || '')){ a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer'); }
      });
    }

    box.querySelectorAll('.rte-toolbar button').forEach(function(b){
      b.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
    });
    box.querySelector('.rte-toolbar').addEventListener('click', function(ev){
      var btn = ev.target.closest('button[data-cmd]');
      if(!btn) return;
      var cmd = btn.getAttribute('data-cmd');
      if(cmd === 'bold' || cmd === 'italic'){
        if(!hasSelectionInBody()) restore();
        document.execCommand(cmd);
      } else if(cmd === 'link'){
        remember();
        var u = window.prompt('Adres linku (https://… albo e-mail)');
        if(!u) return;
        var n = normUrl(u);
        if(!n){ window.alert('Nieprawidłowy adres linku.'); return; }
        restore();
        document.execCommand('createLink', false, n);
        fixLinks();
      } else if(cmd === 'image'){
        remember();
        fileInput.click();
      } else if(cmd === 'button'){
        remember();
        panel.style.display = 'block';
        box.querySelector('.rp-label').focus();
      }
    });
    fileInput.addEventListener('change', function(ev){
      var f = ev.target.files[0];
      if(!f) return;
      fileToDataUrl(f, function(url){
        restore();
        document.execCommand('insertImage', false, url);
        fileInput.value = '';
      });
    });
    box.querySelector('.rp-cancel').addEventListener('click', function(){ panel.style.display = 'none'; });
    box.querySelector('.rp-insert').addEventListener('click', function(){
      var label = box.querySelector('.rp-label').value.trim();
      var url = normUrl(box.querySelector('.rp-url').value);
      var msg = box.querySelector('.rp-msg');
      if(!label || !url){ msg.textContent = 'Podaj napis i poprawny link.'; return; }
      msg.textContent = '';
      var bg = hexOr(box.querySelector('.rp-bg').value, '#0052FF');
      var fg = hexOr(box.querySelector('.rp-fg').value, '#FFFFFF');
      var ext = /^https?:/i.test(url);
      restore();
      document.execCommand('insertHTML', false,
        '<a class="link-btn" href="'+esc(url)+'"'+(ext ? ' target="_blank" rel="noopener noreferrer"' : '')+' contenteditable="false" style="background:'+bg+';color:'+fg+'"><span>'+esc(label)+'</span></a>&nbsp;');
      panel.style.display = 'none';
      box.querySelector('.rp-label').value = '';
      box.querySelector('.rp-url').value = '';
    });

    return { getHtml: function(){ fixLinks(); return body.innerHTML.trim(); } };
  }

  function fileToDataUrl(file, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var raw = reader.result;
      var img = new Image();
      img.onload = function(){
        try {
          var max = 1000;
          var scale = Math.min(1, max / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          cb(canvas.toDataURL('image/jpeg', 0.72));
        } catch(e){ cb(raw); }
      };
      img.onerror = function(){ cb(raw); };
      img.src = raw;
    };
    reader.readAsDataURL(file);
  }

    function onSubmit(){
      var title = titleVal.trim();
      if(!title){ setStatus('Podaj tytuł quizu.', false); return; }
      var quiz;
      if(quizType === 'wiedza'){
        for(var i=0;i<kQuestions.length;i++){
          if(!kQuestions[i].text.trim()){ setStatus('Uzupełnij treść wszystkich pytań.', false); return; }
          if(kQuestions[i].options.some(function(o){ return !o.trim(); })){ setStatus('Uzupełnij wszystkie odpowiedzi.', false); return; }
        }
        quiz = { id: ex ? ex.id : uid(), type:'wiedza', title: title, questions: JSON.parse(JSON.stringify(kQuestions)), createdAt: ex ? ex.createdAt : Date.now() };
      } else {
        if(outcomes.some(function(o){ return !o.label.trim(); })){ setStatus('Nazwij wszystkie możliwe wyniki.', false); return; }
        for(var j=0;j<rQuestions.length;j++){
          if(!rQuestions[j].text.trim()){ setStatus('Uzupełnij treść wszystkich pytań.', false); return; }
          if(rQuestions[j].options.some(function(o){ return !o.text.trim(); })){ setStatus('Uzupełnij wszystkie odpowiedzi.', false); return; }
        }
        quiz = { id: ex ? ex.id : uid(), type:'wynik', title: title, outcomes: JSON.parse(JSON.stringify(outcomes)), questions: JSON.parse(JSON.stringify(rQuestions)), createdAt: ex ? ex.createdAt : Date.now() };
      }
      if(opts && opts.onSave){
        var lim = opts.limits ? checkQuizLimits(quiz) : '';
        if(lim){ setStatus(lim, false); return; }
        opts.onSave(quiz);
        return;
      }
      var newState = JSON.parse(JSON.stringify(state));
      if(ex){
        newState.quizzes = newState.quizzes.map(function(x){ return x.id === ex.id ? quiz : x; });
        publish(newState, 'Zapisano zmiany.');
      } else {
        newState.quizzes.push(quiz);
        publish(newState, 'Quiz opublikowany.');
      }
    }

  /* ---------------- ZAPIS (Firestore) ---------------- */

  var COLS = ['articles', 'quizzes', 'bands', 'pages'];

  function docSize(o){ return new Blob([JSON.stringify(o)]).size; }

  function publish(newState, okMessage){
    var writes = [];
    var tooBig = false;
    COLS.forEach(function(key){
      var oldMap = {};
      (state[key] || []).forEach(function(x){ oldMap[x.id] = JSON.stringify(x); });
      var newIds = {};
      (newState[key] || []).forEach(function(x){
        newIds[x.id] = true;
        if(oldMap[x.id] !== JSON.stringify(x)){
          if(docSize(x) > 900000) tooBig = true;
          writes.push(function(){ return setDoc(doc(db, key, x.id), x); });
        }
      });
      (state[key] || []).forEach(function(x){
        if(!newIds[x.id]) writes.push(function(){ return deleteDoc(doc(db, key, x.id)); });
      });
    });
    if(tooBig){ setStatus('Wpis jest za duży (limit ok. 1 MB). Usuń część zdjęć albo dodaj mniejsze.', false); return; }
    if(!writes.length){ setStatus('Brak zmian do zapisania.', true); return; }
    setStatus('Zapisywanie…', true);
    Promise.all(writes.map(function(w){ return w(); })).then(function(){
      state = newState;
      editing = null;
      renderEditor();
      setStatus(okMessage || 'Zapisano.', true);
    }).catch(function(e){
      var code = e && e.code ? e.code : '';
      setStatus(code === 'permission-denied' ? 'Brak uprawnień do zapisu. Zaloguj się na właściwe konto.' : 'Nie udało się zapisać (spróbuj ponownie).', false);
    });
  }

  /* ---------------- DZIENNIKARZE: POMOCNIKI I BEZPIECZEŃSTWO ---------------- */

  function safeImg(src){
    return (typeof src === 'string' && /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(src)) ? src : '';
  }

  var HTML_OK = { P:1, BR:1, B:1, STRONG:1, I:1, EM:1, U:1, A:1, IMG:1, DIV:1, SPAN:1, UL:1, OL:1, LI:1, H1:1, H2:1, H3:1, H4:1, BLOCKQUOTE:1 };
  var HTML_DROP = /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|NOSCRIPT|SVG|MATH|FORM|INPUT|BUTTON|TEXTAREA|SELECT|TEMPLATE|FRAME|FRAMESET|BASE)$/;

  function sanitizeHtml(html){
    var doc = new DOMParser().parseFromString('<!DOCTYPE html><html><body><div id="root">' + (html || '') + '</div></body></html>', 'text/html');
    var root = doc.getElementById('root');
    (function clean(node){
      Array.prototype.slice.call(node.childNodes).forEach(function(ch){
        if(ch.nodeType === 3) return;
        if(ch.nodeType !== 1){ node.removeChild(ch); return; }
        var tag = ch.tagName;
        if(!HTML_OK[tag]){
          if(HTML_DROP.test(tag)){ node.removeChild(ch); return; }
          clean(ch);
          while(ch.firstChild) node.insertBefore(ch.firstChild, ch);
          node.removeChild(ch);
          return;
        }
        Array.prototype.slice.call(ch.attributes).forEach(function(at){
          var n = at.name.toLowerCase(), v = (at.value || '').trim(), ok = false;
          if(tag === 'A' && n === 'href') ok = /^(https?:|mailto:|tel:)/i.test(v);
          else if(tag === 'A' && n === 'target') ok = (v === '_blank');
          else if(tag === 'A' && n === 'rel') ok = true;
          else if(tag === 'IMG' && n === 'src') ok = !!safeImg(v) || /^https:[/][/]/i.test(v);
          else if(tag === 'IMG' && n === 'alt') ok = true;
          else if(n === 'class') ok = (v === 'link-btn');
          else if(n === 'style') ok = (ch.getAttribute('class') === 'link-btn') && /^background:\s*#[0-9a-f]{6};\s*color:\s*#[0-9a-f]{6};?$/i.test(v);
          if(!ok) ch.removeAttribute(at.name);
        });
        if(tag === 'A' && ch.getAttribute('target')) ch.setAttribute('rel', 'noopener noreferrer');
        clean(ch);
      });
    })(root);
    return root.innerHTML;
  }

  function subToItem(sub){
    var it = sub.item || {};

    out.id = sub.id;
    out.authorUid = sub.authorUid;
    out.authorNameSnap = sub.authorName;
    out.fromJournalist = true;
    if(typeof out.createdAt !== 'number') out.createdAt = sub.createdAt;
    return out;
  }

  function authorOf(item){
    if(!item) return null;
    if(item.authorUid){
      var j = (state.journalists || []).filter(function(x){ return x.id === item.authorUid; })[0];
      var name = j ? j.name : item.authorNameSnap;
      if(!name) return null;
      return { name: name, photo: j ? safeImg(j.photo) : '' };

  function fileToAvatar(file, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var s = 160, c = document.createElement('canvas');
        c.width = s; c.height = s;
        var side = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, s, s);
        cb(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function(){ cb(null); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function readImages(coverFile, avatarFile, done){

  function checkQuizLimits(q){
    if(q.title.length > 120) return 'Tytuł może mieć maksymalnie 120 znaków.';
    if(q.questions.length > 20) return 'Quiz może mieć maksymalnie 20 pytań.';
    for(var i = 0; i < q.questions.length; i++){
      var qq = q.questions[i];
      if(qq.text.length > 300) return 'Pytanie ' + (i + 1) + ' jest za długie (maks. 300 znaków).';
      if(qq.options.length > 6) return 'Pytanie ' + (i + 1) + ' ma za dużo odpowiedzi (maks. 6).';
      for(var j = 0; j < qq.options.length; j++){
        var t = (typeof qq.options[j] === 'string') ? qq.options[j] : qq.options[j].text;
        if(t.length > 150) return 'Odpowiedź w pytaniu ' + (i + 1) + ' jest za długa (maks. 150 znaków).';
      }
    }
    if(q.outcomes){
      if(q.outcomes.length > 6) return 'Maksymalnie 6 możliwych wyników.';
      for(var k = 0; k < q.outcomes.length; k++){
        if(q.outcomes[k].label.length > 60) return 'Nazwa wyniku jest za długa (maks. 60 znaków).';
        if((q.outcomes[k].description || '').length > 300) return 'Opis wyniku jest za długi (maks. 300 znaków).';
      }
    }
    return '';
  }

      jobs.push(getDocs(query(collection(db, 'submissions'), where('authorUid', '==', currentUser.uid))).then(mapDocs).then(function(r){ mySubs = r; }).catch(function(){}));
    }
    if(canEdit){
      jobs.push(getDocs(query(collection(db, 'userQuizzes'), where('status', '==', 'pending'))).then(mapDocs).then(function(r){ pendingQuizzes = r; }).catch(function(){}));

  function googleLogin(msgEl){
    msgEl.className = 'login-ok'; msgEl.textContent = 'Logowanie…';
    signInWithPopup(auth, new GoogleAuthProvider()).then(function(){
      msgEl.textContent = '';
    }).catch(function(e){
      var code = e && e.code ? e.code : '';
      msgEl.className = 'login-err';
      if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') msgEl.textContent = '';
      else if(code === 'auth/unauthorized-domain') msgEl.textContent = 'Ta domena nie jest dodana w Firebase (Authorized domains).';
      else if(code === 'auth/operation-not-allowed') msgEl.textContent = 'Logowanie przez Google nie jest włączone w Firebase.';
      else if(code === 'auth/popup-blocked') msgEl.textContent = 'Przeglądarka zablokowała okno logowania. Zezwól na wyskakujące okna i spróbuj ponownie.';
      else msgEl.textContent = 'Nie udało się zalogować (' + (code || 'błąd') + ').';
    });
  }

  function fileToBanner(file, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, 400 / img.width, 1200 / img.height);
        var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        cb(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function(){ cb(null); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function adsConfig(){
    var c = findItem('pages', 'ads');
    var iv = c && parseInt(c.interval, 10);
    return { enabled: !!(c && c.enabled), interval: (iv >= 3 && iv <= 120) ? iv : 8, mobile: !!(c && c.mobile) };
  }

  function validAd(a){
    return !!(a && a.active !== false && safeImg(a.image) && /^https?:[/][/]/i.test(a.link || ''));
  }

  function unmountAds(){
    if(adTimer){ clearInterval(adTimer); adTimer = null; }
    var el = document.getElementById('ad-slot');
    if(el && el.parentNode) el.parentNode.removeChild(el);
  }

  function mountAds(cfg, list){
    unmountAds();
    var items = (list || []).filter(validAd);
    if(!cfg.enabled || !items.length) return;
    var el = document.createElement('aside');
    el.id = 'ad-slot';
    el.className = 'ad-slot' + (cfg.mobile ? '' : ' no-narrow');
    el.setAttribute('aria-label', 'Reklama');
    el.innerHTML = '<div class="ad-label">Reklama</div><a class="ad-link" target="_blank" rel="noopener noreferrer sponsored"><img alt=""></a>';
    var main = document.getElementById('app');
    main.parentNode.insertBefore(el, main);
    var a = el.querySelector('a'), img = el.querySelector('img');
    var idx = Math.floor(Math.random() * items.length);
    function show(i){
      var it = items[i];
      a.href = it.link;
      img.alt = it.alt || 'Reklama';
      img.src = it.image;
    }
    show(idx);
    if(items.length > 1){
      adTimer = setInterval(function(){
        img.classList.add('ad-fade');
        setTimeout(function(){ idx = (idx + 1) % items.length; show(idx); img.classList.remove('ad-fade'); }, 300);
      }, cfg.interval * 1000);
    }
  }

  function startAds(){
    var cfg = adsConfig();
    if(!cfg.enabled){ unmountAds(); return; }
    getDocs(collection(db, 'ads')).then(mapDocs).then(function(list){ mountAds(cfg, list); }).catch(function(){});
  }

  function shareBtnHtml(hash, title, text, label){
    return '<button type="button" class="btn small secondary share-btn" data-share="'+esc(hash)+'" data-title="'+esc(title || '')+'" data-text="'+esc(text || title || '')+'">↗ '+esc(label || 'Udostępnij')+'</button>';
  }

  function shareRowHtml(hash, title, text, label){
    return '<div class="share-row">'+shareBtnHtml(hash, title, text, label)+'</div>';
  }

  function onShareClick(ev){
    var btn = ev.target.closest ? ev.target.closest('[data-share]') : null;
    if(!btn) return;
    var url = location.origin + location.pathname + btn.getAttribute('data-share');
    var title = btn.getAttribute('data-title') || document.title;
    var text = btn.getAttribute('data-text') || title;
    if(navigator.share){
      navigator.share({ title: title, text: text, url: url }).catch(function(){});
      return;
    }
    var old = btn.textContent;
    var done = function(){ btn.textContent = '✓ Skopiowano link'; setTimeout(function(){ btn.textContent = old; }, 1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ window.prompt('Skopiuj link:', url); });
    } else {
      window.prompt('Skopiuj link:', url);
    }
  }

  /* ---------------- ROUTER ---------------- */

  function route(){
    var hash = location.hash || '#/';
    var parts = hash.replace(/^#\/?/, '').split('/').filter(Boolean);

    if(!loaded){
      renderNav('');
      appEl.innerHTML = loadError ? '<div class="empty">Nie udało się wczytać treści. Odśwież stronę.</div>' : '<div class="empty">Ładowanie…</div>';
      return;
    }
    if(parts.length === 0){ renderNav('home'); renderHome(); return; }
    if(parts[0] === 'artykuly'){ renderNav('artykuly'); renderArticles(); return; }
    if(parts[0] === 'artykul' && parts[1]){ renderNav('artykuly'); renderArticleFull(parts[1]); return; }
    if(parts[0] === 'quizy'){ renderNav('quizy'); renderQuizzes(); return; }
    if(parts[0] === 'quiz' && parts[1]){ renderNav('quizy'); renderQuizTake(parts[1]); return; }
    if(parts[0] === 'zespoly'){ renderNav('zespoly'); renderBands(); return; }
    if(parts[0] === 'kontakt'){ renderNav('kontakt'); renderContact(); return; }
    if(parts[0] === 'moje-quizy'){ renderNav('quizy'); renderMyQuizzes(); return; }
    if(parts[0] === 'dziennikarz'){ renderNav(''); renderJournalistPanel(); return; }
    if(parts[0] === 'zespol' && parts[1]){ renderNav('zespoly'); renderBands(parts[1]); return; }
    if(parts[0] === 'edytor'){ renderNav('edytor'); renderEditor(); return; }
    renderNav('home'); renderHome();
  }

  window.addEventListener('hashchange', route);

  function loadAll(){
    var jobs = COLS.map(function(k){ return getDocs(collection(db, k)).then(mapDocs); });
    jobs.push(getDocs(query(collection(db, 'userQuizzes'), where('status', '==', 'published'))).then(mapDocs).catch(function(){ return []; }));
    jobs.push(getDocs(query(collection(db, 'submissions'), where('status', '==', 'published'))).then(mapDocs).catch(function(){ return []; }));
    jobs.push(getDocs(collection(db, 'journalists')).then(mapDocs).catch(function(){ return []; }));
    return Promise.all(jobs).then(function(res){
      var subs = res[5];
      state = {
        articles: res[0], quizzes: res[1], bands: res[2], pages: res[3], uquizzes: res[4],
        jarticles: subs.filter(function(s){ return s.kind === 'article'; }).map(subToItem),
        jbands: subs.filter(function(s){ return s.kind === 'band'; }).map(subToItem),
        journalists: res[6]
      };
      loaded = true;
    });
  }

  function init(){
    appEl.innerHTML = '<div class="empty">Ładowanie…</div>';
    renderNav('');
    appEl.addEventListener('click', onShareClick);
    var finish = Promise.resolve();
    if(isSignInWithEmailLink(auth, location.href)){
      var email = null;
      try { email = localStorage.getItem('muza_email_for_signin'); } catch(e){}
      if(!email) email = window.prompt('Podaj adres e-mail, na który przyszedł link:');
      var clean = location.origin + location.pathname + '#/edytor';
      if(email){
        finish = signInWithEmailLink(auth, email, location.href).then(function(){
          try { localStorage.removeItem('muza_email_for_signin'); } catch(e){}
          history.replaceState(null, '', clean);
        }).catch(function(){
          loginNote = 'Link jest nieprawidłowy albo wygasł. Wyślij nowy.';
          history.replaceState(null, '', clean);
        });
      } else {
        history.replaceState(null, '', clean);
      }
    }
    finish.then(function(){
      onAuthStateChanged(auth, function(user){
        currentUser = user;
        canEdit = !!(user && user.email && EDITOR_EMAILS.some(function(e){ return e.toLowerCase() === user.email.toLowerCase(); }));
        authReady = true;
        route();
        if(user) touchUser(user);
        loadPrivate().then(function(){
          var hsh = location.hash || '';
          if(hsh.indexOf('#/moje-quizy') === 0 || hsh.indexOf('#/edytor') === 0 || hsh.indexOf('#/dziennikarz') === 0) route();
        });
      });
      return loadAll();
    }).catch(function(){ loadError = true; }).then(function(){ route(); startAds(); });
  }

  init();
})();
</script>
</body>
</html>
